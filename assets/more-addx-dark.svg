<svg xmlns="http://www.w3.org/2000/svg" width="292" height="112" viewBox="0 0 292 112" role="img" aria-label="AddX: Expo app that turns a store promotion into an audio ad."><title>AddX: Expo app that turns a store promotion into an audio ad.</title><style>.m{font-family:'JetBrains Mono', 'Cascadia Code', 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace}.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.k{animation:on .01s both}.f{animation:up .45s ease-out both}.b{animation:on .01s both,blink 1.1s steps(1) infinite}.p{animation:pulse 2.4s ease-in-out infinite}@keyframes on{from{opacity:0}to{opacity:1}}@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@keyframes blink{50%{opacity:0}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="291" height="111" rx="10" fill="#0b0f14"/><path d="M.5 30V10.5A10 10 0 0 1 10.5 .5H281.5A10 10 0 0 1 291.5 10.5V30Z" fill="#151a21"/><path d="M.5 30H291.5" stroke="#2b323c"/><text x="16.0" y="19.5" class="m" font-size="11" fill="#8b949e" textLength="39.6" lengthAdjust="spacing"><tspan fill="#636c76">~/</tspan><tspan fill="#8b949e">addX</tspan></text><path d="M269.0 18.5L276.0 11.5M270.8 11.5H276.0V13.2" fill="none" stroke="#c4ccd5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="60.0" class="s" font-size="16" fill="#e6edf3" font-weight="700">AddX</text><text x="16.0" y="82.0" class="s" font-size="13" fill="#8b949e">Expo app that turns a store promotion into</text><text x="16.0" y="100.0" class="s" font-size="13" fill="#8b949e">an audio ad.</text><rect x=".5" y=".5" width="291" height="111" rx="10" fill="none" stroke="#2b323c"/></svg>

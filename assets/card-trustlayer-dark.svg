<svg xmlns="http://www.w3.org/2000/svg" width="460" height="272" viewBox="0 0 460 272" role="img" aria-label="TrustLayer AI (llm verification · hackathon): Splits an AI answer into claims, checks each one against Wikipedia and web search, and scores how far to trust it. top national finalist, GFG ByteQuest. Stack: next.js, express, gemini, groq, openrouter."><title>TrustLayer AI (llm verification · hackathon): Splits an AI answer into claims, checks each one against Wikipedia and web search, and scores how far to trust it. top national finalist, GFG ByteQuest. Stack: next.js, express, gemini, groq, openrouter.</title><style>.m{font-family:'JetBrains Mono', 'Cascadia Code', 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace}.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.k{animation:on .01s both}.f{animation:up .45s ease-out both}.b{animation:on .01s both,blink 1.1s steps(1) infinite}.p{animation:pulse 2.4s ease-in-out infinite}@keyframes on{from{opacity:0}to{opacity:1}}@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@keyframes blink{50%{opacity:0}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="459" height="271" rx="10" fill="#0b0f14"/><path d="M.5 36V10.5A10 10 0 0 1 10.5 .5H449.5A10 10 0 0 1 459.5 10.5V36Z" fill="#151a21"/><path d="M.5 36H459.5" stroke="#2b323c"/><text x="24.0" y="23.0" class="m" font-size="12" fill="#8b949e" textLength="115.2" lengthAdjust="spacing"><tspan fill="#636c76">~/</tspan><tspan fill="#8b949e">Trust-layer-AI</tspan></text><text x="422.0" y="23.0" class="m" font-size="12" fill="#c4ccd5" text-anchor="end" textLength="28.8" lengthAdjust="spacing">repo</text><path d="M429.0 21.0L436.0 14.0M430.8 14.0H436.0V15.8" fill="none" stroke="#c4ccd5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="24.0" y="80.0" class="s" font-size="23" fill="#e6edf3" font-weight="700">TrustLayer AI</text><text x="24.0" y="103.0" class="m" font-size="12" fill="#ff6b5e" textLength="201.6" lengthAdjust="spacing">llm verification · hackathon</text><text x="24.0" y="134.0" class="s" font-size="15" fill="#c4ccd5">Splits an AI answer into claims, checks each one</text><text x="24.0" y="156.0" class="s" font-size="15" fill="#c4ccd5">against Wikipedia and web search, and scores how far</text><text x="24.0" y="178.0" class="s" font-size="15" fill="#c4ccd5">to trust it.</text><path d="M24 201.5l7 4.5-7 4.5z" fill="#ff6b5e"/><text x="40.0" y="210.0" class="m" font-size="13" fill="#e6edf3" textLength="280.8" lengthAdjust="spacing"><tspan fill="#e6edf3">top national finalist, GFG ByteQuest</tspan></text><rect x="24.0" y="226.5" width="64.3" height="24" rx="6" fill="#121820" stroke="#2b323c"/><text x="32.0" y="242.5" class="m" font-size="11.5" fill="#c4ccd5" textLength="48.3" lengthAdjust="spacing">next.js</text><rect x="94.3" y="226.5" width="64.3" height="24" rx="6" fill="#121820" stroke="#2b323c"/><text x="102.3" y="242.5" class="m" font-size="11.5" fill="#c4ccd5" textLength="48.3" lengthAdjust="spacing">express</text><rect x="164.6" y="226.5" width="57.4" height="24" rx="6" fill="#121820" stroke="#2b323c"/><text x="172.6" y="242.5" class="m" font-size="11.5" fill="#c4ccd5" textLength="41.4" lengthAdjust="spacing">gemini</text><rect x="228.0" y="226.5" width="43.6" height="24" rx="6" fill="#121820" stroke="#2b323c"/><text x="236.0" y="242.5" class="m" font-size="11.5" fill="#c4ccd5" textLength="27.6" lengthAdjust="spacing">groq</text><rect x="277.6" y="226.5" width="85.0" height="24" rx="6" fill="#121820" stroke="#2b323c"/><text x="285.6" y="242.5" class="m" font-size="11.5" fill="#c4ccd5" textLength="69.0" lengthAdjust="spacing">openrouter</text><rect x=".5" y=".5" width="459" height="271" rx="10" fill="none" stroke="#2b323c"/></svg>
